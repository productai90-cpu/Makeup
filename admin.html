<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>پنل مدیریت — سونیا میکاپ آرتیست</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap");
      :root {
        --ink: #302a2b;
        --muted: #7c7071;
        --rose: #d9b8bb;
        --rose-deep: #b98e93;
        --blush: #f4e9e8;
        --cream: #fbf8f6;
        --paper: #fffdfc;
        --line: #e8dedd;
        --err: #b23b3b;
        --serif: Georgia, "Times New Roman", serif;
        --sans:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: var(--sans);
        background: var(--paper);
        color: var(--ink);
        margin: 0;
        padding: 32px 24px;
        overflow-x: hidden;
        font-size: 14.5px;
        line-height: 1.6;
      }
      h2 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 26px;
        margin: 0;
      }
      h3 {
        font-family: var(--serif);
        font-weight: 400;
        font-size: 17px;
        margin: 0;
      }
      input,
      select {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
        padding: 11px 12px;
        margin: 4px 0;
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        outline: none;
        transition: 0.2s;
      }
      input:focus,
      select:focus {
        border-color: var(--rose-deep);
      }
      button {
        background: var(--ink);
        color: #fff;
        border: 1px solid var(--ink);
        padding: 11px 20px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.05em;
        font: inherit;
        transition: 0.2s;
      }
      button:hover {
        background: transparent;
        color: var(--ink);
      }
      button.primary {
        background: var(--rose-deep);
        border-color: var(--rose-deep);
      }
      button.primary:hover {
        background: transparent;
        color: var(--rose-deep);
      }
      button.danger {
        background: #fff;
        color: var(--err);
        border: 1px solid #e6c6c6;
      }
      button.danger:hover {
        background: var(--err);
        color: #fff;
        border-color: var(--err);
      }

      .table-scroll {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .table-scroll::-webkit-scrollbar {
        display: none;
      }
      table {
        width: 100%;
        min-width: 680px;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 12px 10px;
        text-align: right;
        font-size: 0.85rem;
        white-space: nowrap;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
      .badge {
        padding: 3px 10px;
        font-size: 0.68rem;
        border: 1px solid var(--line);
        border-radius: 1px;
      }
      .badge.manual {
        background: var(--blush);
        border-color: var(--rose);
      }
      .badge.site {
        background: #f0f5ef;
        border-color: #bcd4b8;
      }
      .badge.cancelled {
        opacity: 0.45;
        text-decoration: line-through;
      }
      .note-line {
        display: block;
        white-space: normal;
        max-width: 230px;
        margin-top: 5px;
        color: var(--rose-deep);
        font-size: 0.75rem;
        line-height: 1.5;
      }

      #loginBox {
        max-width: 340px;
        margin: 100px auto;
      }
      #loginBox h2 {
        margin-bottom: 20px;
      }
      #loginError {
        color: var(--err);
        font-size: 13px;
      }
      #panel {
        display: none;
        max-width: 1040px;
        margin: auto;
      }
      .panel-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 6px;
      }
      .brand-mini {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .brand-mini .b1 {
        font-family: var(--serif);
        font-size: 20px;
      }
      .brand-mini .b2 {
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 5px;
      }

      form#manualForm {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 10px;
        border: 1px solid var(--line);
        background: var(--cream);
        padding: 22px;
        margin-top: 34px;
      }
      form#manualForm > button {
        grid-column: 1/-1;
      }
      form#manualForm > h3 {
        grid-column: 1/-1;
        margin-bottom: 6px;
      }

      .calendar-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .calendar-label {
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 0.03em;
      }
      .date-picker-wrap {
        position: relative;
        width: 42px;
        height: 42px;
      }
      .date-picker-btn {
        width: 42px;
        height: 42px;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        line-height: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .date-picker-btn:hover {
        border-color: var(--rose-deep);
        color: var(--rose-deep);
      }
      .date-picker-btn svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      .cal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(48, 42, 43, 0.35);
        z-index: 850;
        display: none;
      }
      .cal-backdrop.open {
        display: block;
      }
      .cal-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 900;
        width: 280px;
        max-width: 88vw;
        background: #fff;
        border: 1px solid var(--line);
        padding: 18px;
        display: none;
        box-shadow: 0 20px 60px rgba(48, 42, 43, 0.18);
      }
      .cal-popup.open {
        display: block;
      }
      .cal-pop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .cal-pop-title {
        font-family: var(--serif);
        font-size: 0.95rem;
      }
      .cal-nav {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.05rem;
        line-height: 1;
      }
      .cal-nav:hover {
        border-color: var(--rose-deep);
        color: var(--rose-deep);
      }
      .cal-pop-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 5px;
      }
      .cal-head {
        text-align: center;
        font-size: 0.68rem;
        color: var(--muted);
        padding: 2px 0 6px;
      }
      .cal-cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 0.82rem;
        padding: 0;
        cursor: pointer;
        transition: 0.15s;
      }
      .cal-cell:hover:not(.disabled):not(.empty) {
        border-color: var(--rose-deep);
      }
      .cal-cell.selected {
        background: var(--rose-deep);
        color: #fff;
        border-color: var(--rose-deep);
      }
      .cal-cell.empty {
        background: transparent;
        border: none;
        cursor: default;
      }
      .cal-cell.disabled {
        opacity: 0.3;
        cursor: not-allowed;
        pointer-events: none;
      }

      .day-scroll {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 8px;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .day-scroll::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }
      .day-card {
        flex: 0 0 74px;
        min-width: 74px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 80px;
        padding: 12px 6px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.85rem;
        cursor: pointer;
        transition: 0.2s;
      }
      .day-card .dnum {
        font-family: var(--serif);
        font-size: 1.3rem;
        color: var(--ink);
      }
      .day-card:hover {
        border-color: var(--rose-deep);
      }
      .day-card.selected {
        border-color: var(--rose-deep);
        background: var(--rose-deep);
        color: #fff;
      }
      .day-card.selected .dnum {
        color: #fff;
      }

      .time-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .time-btn {
        padding: 15px 6px;
        background: #fff;
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        transition: 0.2s;
      }
      .time-btn:hover {
        border-color: var(--rose-deep);
      }
      .time-btn.selected {
        background: var(--rose-deep);
        color: #fff;
        border-color: var(--rose-deep);
      }
      .time-btn:disabled,
      .time-btn.taken {
        opacity: 0.35;
        cursor: not-allowed;
        text-decoration: line-through;
      }

      @media (max-width: 640px) {
        body {
          padding: 20px 14px;
        }
        #loginBox {
          margin: 60px auto;
        }
        form#manualForm {
          grid-template-columns: minmax(0, 1fr);
        }
        .time-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        th,
        td {
          padding: 9px 6px;
          font-size: 0.78rem;
        }
      }
      @media (max-width: 380px) {
        .time-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div id="loginBox">
      <h2>ورود سونیا</h2>
      <input id="email" placeholder="ایمیل" />
      <input id="password" type="password" placeholder="رمز عبور" />
      <button
        class="primary"
        style="width: 100%; margin-top: 8px"
        onclick="login()"
      >
        ورود
      </button>
      <p id="loginError"></p>
    </div>

    <div id="panel">
      <div class="panel-top">
        <div class="brand-mini">
          <span class="b1">سونیا</span>
          <span class="b2">پنل مدیریت رزروها</span>
        </div>
        <button onclick="logout()">خروج</button>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>تاریخ</th>
              <th>ساعت</th>
              <th>مشتری</th>
              <th>خدمت</th>
              <th>مدت</th>
              <th>منبع</th>
              <th>وضعیت</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <form id="manualForm" onsubmit="addManual(event)">
        <h3>مسدود کردن دستی یک تایم (رزرو تلفنی/حضوری)</h3>

        <div style="grid-column: 1/-1">
          <div class="calendar-toolbar">
            <div class="calendar-label">انتخاب روز</div>
            <div class="date-picker-wrap">
              <button
                type="button"
                class="date-picker-btn"
                aria-label="انتخاب مستقیم تاریخ از تقویم"
                onclick="openAdminDatePicker()"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4" width="18" height="18"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </button>
              <div
                class="cal-backdrop"
                id="mCalBackdrop"
                onclick="closeAdminDatePicker()"
              ></div>
              <div class="cal-popup" id="mCalendarPopup"></div>
            </div>
          </div>
          <div class="day-scroll" id="mDateCalendar"></div>
        </div>

        <div style="grid-column: 1/-1">
          <div class="calendar-label" style="margin: 16px 0 8px">
            انتخاب ساعت
          </div>
          <div class="time-grid" id="mTimeGrid"></div>
        </div>

        <input id="mName" placeholder="نام مشتری (اختیاری)" />
        <select id="mDuration">
          <option value="90">۹۰ دقیقه (اختصاصی)</option>
          <option value="120">۱۲۰ دقیقه (مراسم / ادیتوریال)</option>
          <option value="150">۱۵۰ دقیقه (عروس)</option>
        </select>
        <button type="submit" class="primary" style="margin-top: 8px">
          مسدود کردن این تایم
        </button>
      </form>
    </div>

    <script>
      const sb = window.supabase.createClient(
        "https://ebznilmeaapienmytmsz.supabase.co",
        "sb_publishable_Pv5AZFjGgd2JIgjyQt6eOA_IXTFokPu",
      );

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          document.getElementById("loginError").textContent =
            "ایمیل یا رمز اشتباه است.";
          return;
        }
        await checkSession();
      }
      async function logout() {
        await sb.auth.signOut();
        location.reload();
      }

      async function checkSession() {
        const {
          data: { session },
        } = await sb.auth.getSession();
        if (!session) return;
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
        await loadBookings();
      }

      async function loadBookings() {
        const { data, error } = await sb
          .from("bookings")
          .select("*")
          .gte("booking_date", new Date().toISOString().slice(0, 10))
          .order("booking_date")
          .order("booking_time");
        if (error) {
          console.error(error);
          return;
        }
        document.getElementById("rows").innerHTML = data
          .map(
            (b) => `
        <tr>
          <td>${new Date(b.booking_date + "T00:00:00").toLocaleDateString("fa-IR", { day: "numeric", month: "short" })}</td>
          <td>${b.booking_time.slice(0, 5)}</td>
          <td>${b.customer_name || "—"} ${b.customer_phone ? `<br><small>${b.customer_phone}</small>` : ""} ${b.notes ? `<span class="note-line">${escapeHtml(b.notes)}</span>` : ""}</td>
          <td>${b.service_name || "—"}</td>
          <td>${b.total_duration} دقیقه</td>
          <td><span class="badge ${b.source}">${b.source === "site" ? "سایت" : "دستی"}</span></td>
          <td><span class="badge ${b.status === "cancelled" ? "cancelled" : ""}">${b.status === "cancelled" ? "لغوشده" : "فعال"}</span></td>
          <td>${b.status === "confirmed" ? `<button class="danger" onclick="cancelBooking('${b.id}')">لغو</button>` : ""}</td>
        </tr>
      `,
          )
          .join("");
      }

      async function cancelBooking(id) {
        if (!confirm("این رزرو لغو شود؟")) return;
        const { error } = await sb
          .from("bookings")
          .update({ status: "cancelled" })
          .eq("id", id);
        if (error) {
          alert("خطا در لغو رزرو");
          return;
        }
        await loadBookings();
        await loadTakenTimesForDay();
      }

      async function addManual(e) {
        e.preventDefault();
        if (!mDay) return alert("لطفاً یک روز رو از تقویم انتخاب کنید.");
        if (!mTime) return alert("لطفاً یک ساعت رو انتخاب کنید.");
        const name =
          document.getElementById("mName").value.trim() || "رزرو حضوری/تلفنی";
        const duration = parseInt(
          document.getElementById("mDuration").value,
          10,
        );
        const { error } = await sb.from("bookings").insert({
          booking_date: mDay,
          booking_time: mTime + ":00",
          customer_name: name,
          total_duration: duration,
          status: "confirmed",
          source: "manual",
        });
        if (error) {
          alert(
            error.code === "23505"
              ? "این تایم قبلاً رزرو شده است."
              : "خطا در ثبت.",
          );
          return;
        }
        e.target.reset();
        mDay = null;
        mTime = null;
        mTakenTimes = new Set();
        renderAdminCalendar();
        renderCalendarPopup();
        renderAdminTimes();
        await loadBookings();
      }

      checkSession();

      const ADMIN_TIMES = [
        { label: "۱۰:۰۰", value: "10:00" },
        { label: "۱۱:۰۰", value: "11:00" },
        { label: "۱۲:۳۰", value: "12:30" },
        { label: "۱۴:۰۰", value: "14:00" },
        { label: "۱۵:۳۰", value: "15:30" },
        { label: "۱۷:۰۰", value: "17:00" },
        { label: "۱۸:۳۰", value: "18:30" },
        { label: "۲۰:۰۰", value: "20:00" },
      ];
      let mDay = null,
        mTime = null,
        mTakenTimes = new Set();

      const FA_WEEKDAY_INDEX = {
        شنبه: 0,
        یکشنبه: 1,
        دوشنبه: 2,
        سه‌شنبه: 3,
        چهارشنبه: 4,
        پنجشنبه: 5,
        جمعه: 6,
      };
      const FA_WEEKDAYS = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
      const faLatnFmt = new Intl.DateTimeFormat("fa-IR-u-nu-latn", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      });

      function jParts(d) {
        const parts = faLatnFmt.formatToParts(d);
        const o = {};
        parts.forEach((p) => {
          if (p.type !== "literal") o[p.type] = parseInt(p.value, 10);
        });
        return { y: o.year, m: o.month, d: o.day };
      }
      function jMonthStart(refDate) {
        const jp = jParts(refDate);
        const start = new Date(refDate);
        start.setDate(start.getDate() - (jp.d - 1));
        return start;
      }
      function jMonthDays(monthStart) {
        const jp = jParts(monthStart);
        const days = [];
        let cur = new Date(monthStart);
        while (jParts(cur).m === jp.m) {
          days.push(new Date(cur));
          cur.setDate(cur.getDate() + 1);
        }
        return days;
      }

      function pickAdminDay(iso) {
        mDay = iso;
        mTime = null;
        closeAdminDatePicker();
        renderAdminCalendar();
        renderCalendarPopup();
        loadTakenTimesForDay();
      }

      async function loadTakenTimesForDay() {
        if (!mDay) {
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        const { data, error } = await sb.rpc("get_taken_slots", {
          p_date: mDay,
        });
        if (error) {
          console.error(error);
          mTakenTimes = new Set();
          renderAdminTimes();
          return;
        }
        mTakenTimes = new Set(
          (data || []).map((r) => r.booking_time.slice(0, 5)),
        );
        renderAdminTimes();
      }

      function renderAdminCalendar() {
        const root = document.getElementById("mDateCalendar");
        const now = new Date();
        let cells = "";
        for (let i = 0; i < 30; i++) {
          let d = new Date(now);
          d.setDate(now.getDate() + i);
          let iso = d.toISOString().slice(0, 10);
          let wname = d.toLocaleDateString("fa-IR", { weekday: "short" });
          let dnum = d.toLocaleDateString("fa-IR", { day: "numeric" });
          let dmonth = d.toLocaleDateString("fa-IR", { month: "short" });
          cells += `<button type="button" class="day-card ${mDay === iso ? "selected" : ""}" onclick="pickAdminDay('${iso}')">
          <span>${wname}</span><span class="dnum">${dnum}</span><span>${dmonth}</span>
        </button>`;
        }
        root.innerHTML = cells;
        if (mDay) {
          let sel = root.querySelector(".day-card.selected");
          if (sel) sel.scrollIntoView({ inline: "nearest", block: "nearest" });
        }
      }

      let mViewDate = new Date();
      function renderCalendarPopup() {
        const root = document.getElementById("mCalendarPopup");
        const now = new Date();
        const minIso = now.toISOString().slice(0, 10);
        const maxDate = new Date(now);
        maxDate.setDate(now.getDate() + 29);
        const maxIso = maxDate.toISOString().slice(0, 10);
        const monthStart = jMonthStart(mViewDate);
        const days = jMonthDays(monthStart);
        const monthLabel = monthStart.toLocaleDateString("fa-IR", {
          month: "long",
          year: "numeric",
        });
        const firstOffset =
          FA_WEEKDAY_INDEX[
            monthStart.toLocaleDateString("fa-IR", { weekday: "long" })
          ] ?? 0;
        let head = `<div class="cal-pop-header"><button type="button" class="cal-nav" onclick="mChangeMonth(-1)">‹</button><span class="cal-pop-title">${monthLabel}</span><button type="button" class="cal-nav" onclick="mChangeMonth(1)">›</button></div>`;
        let cells = FA_WEEKDAYS.map(
          (w) => `<div class="cal-head">${w}</div>`,
        ).join("");
        for (let i = 0; i < firstOffset; i++)
          cells += `<div class="cal-cell empty"></div>`;
        days.forEach((d) => {
          const iso = d.toISOString().slice(0, 10);
          const dnum = d.toLocaleDateString("fa-IR", { day: "numeric" });
          const disabled = iso < minIso || iso > maxIso;
          const sel = mDay === iso;
          cells += `<button type="button" class="cal-cell ${disabled ? "disabled" : ""} ${sel ? "selected" : ""}" onclick="pickAdminDay('${iso}')">${dnum}</button>`;
        });
        root.innerHTML = head + `<div class="cal-pop-grid">${cells}</div>`;
      }
      function mChangeMonth(dir) {
        const monthStart = jMonthStart(mViewDate);
        if (dir < 0) {
          mViewDate = new Date(monthStart);
          mViewDate.setDate(mViewDate.getDate() - 1);
        } else {
          const days = jMonthDays(monthStart);
          mViewDate = new Date(days[days.length - 1]);
          mViewDate.setDate(mViewDate.getDate() + 1);
        }
        renderCalendarPopup();
      }

      function openAdminDatePicker() {
        document.getElementById("mCalendarPopup").classList.add("open");
        document.getElementById("mCalBackdrop").classList.add("open");
        mViewDate = mDay ? new Date(mDay + "T00:00:00") : new Date();
        renderCalendarPopup();
      }
      function closeAdminDatePicker() {
        document.getElementById("mCalendarPopup").classList.remove("open");
        document.getElementById("mCalBackdrop").classList.remove("open");
      }

      function renderAdminTimes() {
        document.getElementById("mTimeGrid").innerHTML = ADMIN_TIMES.map(
          (t) => {
            const isTaken = mTakenTimes.has(t.value);
            const isSel = mTime === t.value;
            return `<button type="button" class="time-btn ${isSel ? "selected" : ""} ${isTaken ? "taken" : ""}"
          ${isTaken ? "disabled" : ""}
          onclick="mTime='${t.value}';renderAdminTimes()">${t.label}</button>`;
          },
        ).join("");
      }

      renderAdminCalendar();
      renderCalendarPopup();
      renderAdminTimes();
    </script>
  </body>
</html>
